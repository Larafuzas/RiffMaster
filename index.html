<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Iconos para iOS y Web App -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#121212',
                        panel: '#1E1E1E',
                        accent: '#FF5722',
                        accentHover: '#E64A19',
                        fretboard: '#3E2723',
                    }

        }

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { background-color: #121212; color: #E0E0E0; font-family: 'Inter', sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1E1E1E; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FF5722; }

        .tab-font { font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }
        .glass { background: rgba(30, 30, 30, 0.8); backdrop-filter: blur(10px); }
        
        .locked-module {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .led-indicator {
            width: 12px; height: 12px; border-radius: 50%;
            display: inline-block; transition: all 0.1s ease;
            box-shadow: 0 0 5px currentColor;
        }
        .led-off { background-color: #333; color: #333; box-shadow: none; }
        .led-on { background-color: #FF5722; color: #FF5722; box-shadow: 0 0 10px #FF5722; }

        /* Modal transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 0.3s, transform 0.3s; }
        
        input[type=range] {
            accent-color: #FF5722;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden selection:bg-accent selection:text-white">

    <!-- Sidebar / Navegación -->
    <aside class="w-20 md:w-64 glass border-r border-gray-800 flex flex-col justify-between z-20">
        <div>
            <div class="h-16 flex items-center justify-center md:justify-start md:px-6 border-b border-gray-800">
                <i class="ph ph-guitar text-accent text-3xl"></i>
                <span class="ml-3 font-bold text-xl hidden md:block text-white">RiffMaster</span>
            </div>
            
            <nav class="p-2 space-y-2 mt-4" id="nav-modules">
                <!-- Modules injected here -->
            </nav>
        </div>

        <div class="p-4 border-t border-gray-800 space-y-4">
            <!-- Tuner -->
            <div class="bg-gray-900 p-3 rounded-xl text-center hidden md:block">
                <h4 class="text-xs text-gray-400 mb-2 uppercase font-bold tracking-wider">Afinador</h4>
                <div class="flex justify-between">
                    <button class="tune-btn text-sm font-bold text-gray-300 hover:text-accent" data-note="E2">E</button>
                    <button class="tune-btn text-sm font-bold text-gray-300 hover:text-accent" data-note="A2">A</button>
                    <button class="tune-btn text-sm font-bold text-gray-300 hover:text-accent" data-note="D3">D</button>
                    <button class="tune-btn text-sm font-bold text-gray-300 hover:text-accent" data-note="G3">G</button>
                    <button class="tune-btn text-sm font-bold text-gray-300 hover:text-accent" data-note="B3">B</button>
                    <button class="tune-btn text-sm font-bold text-gray-300 hover:text-accent" data-note="E4">E</button>
                </div>
            </div>

            <!-- Metronome -->
            <div class="bg-gray-900 p-3 rounded-xl hidden md:block">
                <div class="flex justify-between items-center mb-2">
                    <h4 class="text-xs text-gray-400 uppercase font-bold tracking-wider">Metrónomo</h4>
                    <div id="metro-led" class="led-indicator led-off"></div>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="btn-metro-toggle" class="p-2 bg-gray-800 hover:bg-accent rounded-lg transition-colors">
                        <i class="ph ph-play" id="icon-metro"></i>
                    </button>
                    <input type="range" id="bpm-slider" min="50" max="180" value="90" class="w-full">
                    <span id="bpm-display" class="text-xs font-bold w-8 text-right">90</span>
                </div>
            </div>

            <!-- System Settings -->
            <button id="btn-settings" class="w-full p-3 rounded-xl bg-gray-800 hover:bg-gray-700 flex items-center justify-center md:justify-start transition-colors">
                <i class="ph ph-gear text-xl"></i>
                <span class="ml-3 hidden md:block text-sm font-bold">Sistema</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full bg-dark relative overflow-y-auto scroll-smooth" id="main-scroll">
        <!-- Header con Progreso -->
        <header class="h-16 glass sticky top-0 border-b border-gray-800 flex items-center justify-between px-6 z-10">
            <h2 id="header-title" class="font-bold text-lg md:text-xl text-white">Cargando...</h2>
            <div class="flex items-center space-x-4 w-1/3 justify-end">
                <span id="progress-text" class="text-xs font-bold text-gray-400">0%</span>

                </div>
            </div>
        </header>

        <div class="p-6 md:p-10 max-w-4xl mx-auto w-full pb-32" id="module-content">
            <!-- Content injected here -->
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="modal-settings" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-panel border border-gray-700 rounded-2xl w-full max-w-md p-6 transform scale-95 transition-transform duration-300 shadow-2xl" id="modal-settings-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white flex items-center">
                    <i class="ph ph-gear text-accent mr-2"></i> Configuración
                </h3>
                <button id="btn-close-settings" class="text-gray-400 hover:text-white p-1">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <p class="text-sm text-gray-400 uppercase font-bold tracking-wider mb-2">Acerca de</p>
                    <p class="text-white font-medium">RiffMaster App <span class="text-accent text-sm ml-2">v1.6.0 (iOS Ready)</span></p>
                    <p class="text-xs text-gray-500 mt-1">Motor de Audio: Web Audio API (Buffered + AudioSession)</p>
                </div>

                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <p class="text-sm text-gray-400 uppercase font-bold tracking-wider mb-3">Control de Datos</p>
                    
                    <button id="btn-backup" class="w-full mb-3 bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg flex items-center justify-center transition-colors">
                        <i class="ph ph-export mr-2"></i> Crear Copia de Seguridad (Exportar)
                    </button>
                    
                    <div class="relative w-full">
                        <input type="file" id="file-restore" accept=".json" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div class="w-full bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg flex items-center justify-center transition-colors pointer-events-none">
                            <i class="ph ph-import mr-2"></i> Restaurar Progreso
                        </div>
                    </div>
                    <p id="restore-msg" class="text-xs text-green-400 mt-2 hidden text-center">¡Progreso restaurado con éxito!</p>
                </div>
                
                <div class="bg-red-900/20 p-4 rounded-xl border border-red-900/50">
                    <button id="btn-reset-data" class="w-full text-red-400 hover:text-red-300 font-medium text-sm flex items-center justify-center transition-colors">
                        <i class="ph ph-warning mr-2"></i> Borrar Todo el Progreso
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- AUDIO ENGINE & LOGIC -->
    <script>
        /* ============================================================
         * AUDIO ENGINE & iOS ROBUST UNLOCK (v1.6.0 FIX)
         * ============================================================ */
        const AudioEngine = (() => {
            let ctx = null;
            let isUnlocked = false;
            let backingOsc = null;
            let backingInterval = null;
            let isBackingPlaying = false;

            function getContext() {
                if (!ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    ctx = new AudioContext();
                }
                return ctx;
            }

            function unlockAudio() {
                const audioCtx = getContext();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                try {
                    const nav = navigator;
                    if (nav.audioSession) {
                        nav.audioSession.type = 'playback';
                    }
                } catch (e) { }

                if (isUnlocked) return;
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
                isUnlocked = true;
                console.log("AudioContext unlocked.");
            }

            ['touchstart', 'touchend', 'click', 'keydown'].forEach(evt => {
                document.addEventListener(evt, unlockAudio, { capture: true });
            });

            const noteFreqs = {
                'E2': 82.41, 'F2': 87.31, 'F#2': 92.50, 'G2': 98.00, 'G#2': 103.83, 'A2': 110.00, 'Bb2': 116.54, 'B2': 123.47,
                'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'Eb3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 
                'G#3': 207.65, 'A3': 220.00, 'Bb3': 233.08, 'B3': 246.94, 'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'Eb4': 311.13, 
                'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'C5': 523.25, 'D5': 587.33, 'E5': 659.25
            };

            function playNote(noteName, duration = 1.0, isDistorted = false, timeOffset = 0) {
                const audioCtx = getContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const startTime = audioCtx.currentTime + timeOffset + 0.05;
                const safeDuration = Math.max(duration, 0.05);
                const freq = noteFreqs[noteName] || 220;

                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = isDistorted ? 'sawtooth' : 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);

                filter.type = 'lowpass';
                filter.frequency.value = isDistorted ? 4000 : 2000;

                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(isDistorted ? 0.3 : 0.6, startTime + 0.015);
                // Uso de 0.0001 para evitar el bug de WebKit en iOS al decaer a 0
                gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + safeDuration);

                osc.connect(filter);
                
                if (isDistorted) {
                    const waveShaper = audioCtx.createWaveShaper();
                    waveShaper.curve = makeDistortionCurve(40);
                    filter.connect(waveShaper);
                    waveShaper.connect(gainNode);
                } else {
                    filter.connect(gainNode);
                }

                gainNode.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + safeDuration);
            }

            function makeDistortionCurve(amount) {
                const k = typeof amount === 'number' ? amount : 50;
                const n_samples = 44100;
                const curve = new Float32Array(n_samples);
                const deg = Math.PI / 180;
                for (let i = 0; i < n_samples; ++i) {
                    const x = i * 2 / n_samples - 1;
                    curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }

            function playClick(isHigh = false) {
                const audioCtx = getContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const startTime = audioCtx.currentTime + 0.05;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(isHigh ? 1200 : 800, startTime);
                osc.frequency.exponentialRampToValueAtTime(0.0001, startTime + 0.1);
                
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.5, startTime + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.1);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(startTime);
                osc.stop(startTime + 0.1);
            }

            function playRiff(notes, isDistorted = true, tempo = 100) {
                const beatDuration = 60 / tempo;
                let currentTimeOffset = 0;

                notes.forEach(noteData => {
                    const { note, dur, pause } = noteData;
                    if (note && note !== 'rest') {
                        // Soporte para acordes en riffs (ej. ['E2', 'B2'])
                        if(Array.isArray(note)) {
                            note.forEach(n => playNote(n, dur * beatDuration, isDistorted, currentTimeOffset));
                        } else {
                            playNote(note, dur * beatDuration, isDistorted, currentTimeOffset);
                        }
                    }
                    currentTimeOffset += (dur + (pause || 0)) * beatDuration;
                });
            }

            function playChord(notes, isDistorted = false) {
                notes.forEach(note => playNote(note, 2.0, isDistorted, 0));
            }

            function startBackingTrack(bpm) {
                if (isBackingPlaying) return;
                isBackingPlaying = true;
                const beatTime = 60 / bpm;
                let step = 0;
                
                // Patrón básico de bajo: Tónica en tiempo 1 y 3.
                backingInterval = setInterval(() => {
                    if(step % 4 === 0) playNote('A1', beatTime * 0.8, false, 0); // Bajo
                    if(step % 2 === 1) playClick(false); // Hi-hat simulado
                    if(step % 4 === 2) playNote('A1', beatTime * 0.4, false, 0);
                    step++;
                }, beatTime * 500); // 8ths notes interval
            }

            function stopBackingTrack() {
                isBackingPlaying = false;
                if(backingInterval) clearInterval(backingInterval);
            }

            return { playNote, playChord, playRiff, playClick, startBackingTrack, stopBackingTrack, get isBackingActive() { return isBackingPlaying; } };
        })();


        /* ============================================================
         * DATA STATE & STORAGE
         * ============================================================ */
        let appState = {
            unlocked: [1], // Módulos disponibles. El 1 siempre lo está.
            completed: []  // Módulos superados con cuestionario.
        };

        function loadState() {
            const saved = localStorage.getItem('riffmaster_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.unlocked && Array.isArray(parsed.unlocked)) appState.unlocked = parsed.unlocked;
                    if (parsed.completed && Array.isArray(parsed.completed)) appState.completed = parsed.completed;
                } catch(e) { console.error("Corrupted state", e); }
            }
            updateProgressBar();
        }

        function saveState() {
            localStorage.setItem('riffmaster_state', JSON.stringify(appState));
            updateProgressBar();
        }

        function updateProgressBar() {
            const total = modules.length;
            const comp = appState.completed.length;
            const pct = Math.min(100, Math.max(0, Math.round((comp / total) * 100)));
            document.getElementById('progress-bar').style.width = `${pct}%`;
            document.getElementById('progress-text').innerText = `${pct}%`;
        }

        /* ============================================================
         * SVG GENERATORS
         * ============================================================ */
        function drawFretboard(strings, frets, dots, width=600, height=200) {
            let svg = `<svg viewBox="0 0 ${width} ${height}" class="w-full h-auto bg-fretboard rounded-lg shadow-inner my-4">`;
            const fretSpacing = width / frets;
            const stringSpacing = height / (strings + 1);

            // Trastes (verticales)
            for (let i = 1; i <= frets; i++) {
                const x = i * fretSpacing;
                svg += `<line x1="${x}" y1="0" x2="${x}" y2="${height}" stroke="#A0A0A0" stroke-width="3"/>`;
                // Número de traste abajo
                svg += `<text x="${x - fretSpacing/2}" y="${height - 5}" fill="#FFF" font-size="12" text-anchor="middle" opacity="0.6">${i}</text>`;
            }
            // Cejuela (Nut)
            svg += `<line x1="2" y1="0" x2="2" y2="${height}" stroke="#DDD" stroke-width="6"/>`;

            // Inlays (Marcadores)
            const standardDots = [3, 5, 7, 9, 15, 17, 19];
            for (let i = 1; i <= frets; i++) {
                const x = (i * fretSpacing) - (fretSpacing / 2);
                const y = height / 2;
                if (i === 12) {
                    svg += `<circle cx="${x}" cy="${stringSpacing * 2.5}" r="6" fill="#FFF" opacity="0.4"/>`;
                    svg += `<circle cx="${x}" cy="${stringSpacing * 4.5}" r="6" fill="#FFF" opacity="0.4"/>`;
                } else if (standardDots.includes(i)) {
                    svg += `<circle cx="${x}" cy="${y}" r="6" fill="#FFF" opacity="0.4"/>`;
                }
            }

            // Cuerdas (horizontales)
            const stringNames = ['e', 'B', 'G', 'D', 'A', 'E'];
            for (let i = 1; i <= strings; i++) {
                const y = i * stringSpacing;
                const sw = 1 + (i * 0.4); // Cuerdas graves más gruesas
                svg += `<line x1="0" y1="${y}" x2="${width}" y2="${y}" stroke="#DDD" stroke-width="${sw}"/>`;
                svg += `<text x="10" y="${y - 4}" fill="#FF5722" font-size="12" font-weight="bold">${stringNames[i-1]}</text>`;
            }

            // Puntos de los dedos (dots array)
            dots.forEach(d => {
                const x = (d.fret * fretSpacing) - (fretSpacing / 2);
                const y = d.string * stringSpacing;
                const color = d.root ? '#FF5722' : '#2196F3';
                svg += `<circle cx="${x}" cy="${y}" r="12" fill="${color}"/>`;
                if(d.label) svg += `<text x="${x}" y="${y+4}" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">${d.label}</text>`;
            });

            svg += `</svg>`;
            return svg;
        }

        function drawChordBox(chordName, frets, stringsStatus, width=150, height=180) {
            // stringsStatus: array de 6 [E, A, D, G, B, e]. Ej: ['X', 3, 2, 0, 1, 0]
            let svg = `<div class="inline-block text-center m-2"><svg viewBox="0 0 ${width} ${height}" class="w-32 h-auto">`;
            const startX = 30; const startY = 40;
            const w = 90; const h = 120;
            const strSpace = w / 5; const fretSpace = h / 4;

            svg += `<text x="${width/2}" y="20" fill="#FFF" font-size="18" font-weight="bold" text-anchor="middle">${chordName}</text>`;
            
            // Grid
            for (let i = 0; i <= 5; i++) {
                svg += `<line x1="${startX + i*strSpace}" y1="${startY}" x2="${startX + i*strSpace}" y2="${startY + h}" stroke="#888" stroke-width="2"/>`;
            }
            // Cejuela
            svg += `<line x1="${startX}" y1="${startY}" x2="${startX + w}" y2="${startY}" stroke="#FFF" stroke-width="6"/>`;
            for (let i = 1; i <= 4; i++) {
                svg += `<line x1="${startX}" y1="${startY + i*fretSpace}" x2="${startX + w}" y2="${startY + i*fretSpace}" stroke="#888" stroke-width="2"/>`;
            }

            stringsStatus.forEach((val, i) => {
                const x = startX + i*strSpace;
                if (val === 'X') {
                    svg += `<text x="${x}" y="${startY - 10}" fill="#F44336" font-size="14" text-anchor="middle" font-family="monospace">X</text>`;
                } else if (val === 0) {
                    svg += `<circle cx="${x}" cy="${startY - 14}" r="4" fill="none" stroke="#FFF" stroke-width="2"/>`;
                } else if (val > 0) {
                    const y = startY + (val * fretSpace) - (fretSpace / 2);
                    // Suponemos que la tónica es el primer número que no es X ni 0 buscando de izquierda a derecha. Simplificación visual.
                    svg += `<circle cx="${x}" cy="${y}" r="8" fill="#FF5722"/>`;
                }
            });

            svg += `</svg></div>`;
            return svg;
        }

        /* ============================================================
         * MODULES DATA (8 EXTENSIVE MODULES WITH QUIZZES)
         * ============================================================ */
        const modules = [
            {
                id: 1,
                title: "Módulo 1: Fundamentos y Púa Alternada",
                icon: "ph-lightning",
                description: "Postura, lectura de tablatura en 60s y tu primer riff histórico.",
                quiz: [
                    { q: "¿Qué representa el número '0' en una tablatura?", options: ["Silencio absoluto", "Tocar la cuerda al aire", "Pulsar el traste 10"], correct: 1 },
                    { q: "¿En qué consiste la técnica de púa alternada?", options: ["Tocar siempre hacia abajo", "Alternar movimientos abajo y arriba continuamente", "Usar los dedos en vez de la púa"], correct: 1 }
                ],
                content: `
                    <p class="text-gray-300 mb-4 leading-relaxed">Bienvenido a RiffMaster. Olvídate del solfeo tradicional. Aquí el enfoque es 100% práctico: coge tu guitarra, conéctala (si tienes un ampli tipo Spark, ponlo en <em>Clean</em> o ligero <em>Crunch</em>) y vamos al grano.</p>
                    
                    <h3 class="text-xl font-bold text-white mt-6 mb-2">1. Leer Tablatura en 60 segundos</h3>
                    <p class="text-gray-300 mb-4">La tablatura tiene 6 líneas. La línea de <strong>arriba</strong> representa la cuerda más <strong>fina</strong> (la que está más cerca del suelo). La línea de <strong>abajo</strong> es la cuerda más <strong>gorda</strong> (la que ves más cerca de ti).</p>
                    <div class="bg-gray-900 p-4 rounded-lg overflow-x-auto tab-font text-green-400 mb-6 border border-gray-700">
e|-------------------| (1ª Cuerda - Fina)<br>
B|-------------------| (2ª Cuerda)<br>
G|-------------------| (3ª Cuerda)<br>
D|-------------------| (4ª Cuerda)<br>
A|-------------------| (5ª Cuerda)<br>
E|--0---3---5--------| (6ª Cuerda - Gorda)
                    </div>
                    <p class="text-gray-300 mb-4">Los números indican el <strong>traste</strong>. Un '0' significa tocar la cuerda al aire (sin pisar ningún traste).</p>
                    
                    <h3 class="text-xl font-bold text-white mt-6 mb-2">2. Púa Alternada</h3>
                    <p class="text-gray-300 mb-4">El secreto de la velocidad no es mover la mano rápido, es la economía de movimiento. Acostúmbrate a mover la púa en secuencias: Abajo (↓), Arriba (↑), Abajo (↓), Arriba (↑).</p>
                    
                    <div class="bg-gray-800 p-6 rounded-xl border-l-4 border-accent my-6">

                {note:'C3', dur:0.5}, {note:'E3', dur:0.5}, {note:'G3', dur:0.5}, {note:'C4', dur:0.5}, {note:'E4', dur:0.5}, {note:'C4', dur:0.5}
            ],
            'country': [
                {note:'C#3', dur:0.25}, {note:'D3', dur:0.25}, {note:'C#3', dur:0.25}, {note:'B2', dur:0.5},
                {note:'G2', dur:0.5}, {note:'E2', dur:0.5}, {note:'G#2', dur:1}
            ],
            'funk': [
                {note:['D3','F#3','C4','E4','F#4'], dur:0.25}, // Golpe real
                {note:null, dur:0.25}, {note:null, dur:0.25}, {note:null, dur:0.25}, // Muteos (silencios percusivos)
                {note:['D3','F#3','C4','E4','F#4'], dur:0.25},
                {note:null, dur:0.25}, 
                {note:['D3','F#3','C4','E4','F#4'], dur:0.25}, {note:['D3','F#3','C4','E4','F#4'], dur:0.25}
            ]
        };

        /* ============================================================
         * UI CONTROLLERS & LOGIC
         * ============================================================ */
        let currentModuleId = 1;

        function renderSidebar() {
            const nav = document.getElementById('nav-modules');
            nav.innerHTML = '';
            modules.forEach(mod => {
                const isUnlocked = appState.unlocked.includes(mod.id);
                const isCompleted = appState.completed.includes(mod.id);
                const isActive = mod.id === currentModuleId;
                
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl transition-all flex items-center mb-2 
                    ${isUnlocked ? (isActive ? 'bg-accent/20 text-accent font-bold border border-accent/50' : 'hover:bg-gray-800 text-gray-300') : 'locked-module'}`;
                
                let trailingIcon = '';
                if (!isUnlocked) trailingIcon = '<i class="ph ph-lock-key text-gray-500 ml-auto"></i>';
                else if (isCompleted) trailingIcon = '<i class="ph ph-check-circle text-green-500 ml-auto"></i>';

                btn.innerHTML = `<i class="ph ${mod.icon} text-xl w-6"></i> <span class="hidden md:block ml-2 text-sm">${mod.id}. ${mod.title.split(':')[0]}</span> ${trailingIcon}`;
                
                if (isUnlocked) {
                    btn.addEventListener('click', () => loadModuleUI(mod.id));
                }
                nav.appendChild(btn);
            });
        }

        function loadModuleUI(id) {
            currentModuleId = id;
            const mod = modules.find(m => m.id === id);
            if (!mod) return;

            document.getElementById('header-title').innerText = mod.title;
            
            let htmlContent = `<p class="text-xl font-light text-gray-400 mb-8 border-b border-gray-800 pb-4">${mod.description}</p>${mod.content}`;
            
            // Check completed status
            const isCompleted = appState.completed.includes(id);
            if (isCompleted) {
                htmlContent += `
                    <div class="mt-12 bg-green-900/20 border border-green-500/50 p-6 rounded-xl text-center shadow-lg">
                        <i class="ph ph-check-circle text-4xl text-green-500 mb-2"></i>
                        <h3 class="text-xl font-bold text-green-400 mb-2">Lección Superada</h3>
                        <p class="text-gray-300">¡Genial! Tienes los conocimientos de esta lección dominados.</p>
                        ${id < modules.length ? `<button class="mt-4 bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded-full btn-next" data-next="${id+1}">Ir a la siguiente lección ➔</button>` : `<p class="mt-4 font-bold text-accent">¡Has completado el curso RiffMaster al 100%!</p>`}
                    </div>`;
            } else {
                // Render Quiz
                htmlContent += `
                    <div class="mt-12 bg-gray-800/80 p-6 md:p-8 rounded-2xl border border-gray-700 shadow-xl" id="quiz-container">
                        <div class="flex items-center text-accent mb-4">
                            <i class="ph ph-exam text-3xl mr-3"></i>
                            <h3 class="text-2xl font-bold">Cuestionario de Desbloqueo</h3>
                        </div>
                        <p class="text-gray-400 mb-6">Responde correctamente para guardar tu progreso y acceder a la siguiente lección.</p>
                        <form id="quiz-form" class="space-y-6">`;
                
                mod.quiz.forEach((q, index) => {
                    htmlContent += `<div class="bg-gray-900 p-4 rounded-xl border border-gray-700/50"><p class="font-bold text-white mb-3">${index+1}. ${q.q}</p><div class="space-y-2">`;
                    q.options.forEach((opt, oIndex) => {
                        htmlContent += `<label class="flex items-center space-x-3 cursor-pointer p-2 rounded hover:bg-gray-800 transition">
                            <input type="radio" name="q${index}" value="${oIndex}" class="form-radio text-accent focus:ring-accent w-4 h-4" required>
                            <span class="text-gray-300 text-sm">${opt}</span>
                        </label>`;
                    });
                    htmlContent += `</div></div>`;
                });

                htmlContent += `
                            <button type="submit" class="w-full mt-4 bg-accent hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-accent/20 transition-transform active:scale-95 flex justify-center items-center">
                                <i class="ph ph-lock-key-open text-xl mr-2"></i> Evaluar y Guardar Progreso
                            </button>
                            <div id="quiz-error" class="text-red-400 hidden mt-3 text-center bg-red-900/20 p-2 rounded border border-red-900/50">Respuesta incorrecta. Revisa el contenido e inténtalo de nuevo.</div>
                        </form>
                    </div>`;
            }

            document.getElementById('module-content').innerHTML = htmlContent;
            renderSidebar();
            
            // Re-bind events in dynamic content
            document.querySelectorAll('.btn-play-riff').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const rId = e.currentTarget.getAttribute('data-riff');
                    if (riffData[rId]) {
                        AudioEngine.playRiff(riffData[rId], true, 100);
                    }
                });
            });

            document.querySelectorAll('.btn-next').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const nId = parseInt(e.currentTarget.getAttribute('data-next'));
                    loadModuleUI(nId);
                    document.getElementById('main-scroll').scrollTop = 0;
                });
            });

            const qForm = document.getElementById('quiz-form');
            if (qForm) {
                qForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    let allCorrect = true;
                    mod.quiz.forEach((q, idx) => {
                        const selected = qForm.querySelector(`input[name="q${idx}"]:checked`);
                        if (!selected || parseInt(selected.value) !== q.correct) {
                            allCorrect = false;
                        }
                    });

                    if (allCorrect) {
                        // Success Logic
                        if (!appState.completed.includes(id)) appState.completed.push(id);
                        if (id < modules.length && !appState.unlocked.includes(id + 1)) {
                            appState.unlocked.push(id + 1);
                        }
                        saveState();
                        
                        document.getElementById('quiz-container').innerHTML = `
                            <div class="text-center py-6 animate-pulse">
                                <i class="ph ph-confetti text-5xl text-accent mb-2"></i>
                                <h3 class="text-2xl font-bold text-white">¡Módulo Superado!</h3>
                                <p class="text-gray-400 mt-2">Has desbloqueado nuevo contenido.</p>
                            </div>
                        `;
                        setTimeout(() => {
                            loadModuleUI(id); // Reload to show green success state
                            document.getElementById('main-scroll').scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
                        }, 1500);

                    } else {
                        document.getElementById('quiz-error').classList.remove('hidden');
                    }
                });
            }
        }

        /* ============================================================
         * EVENT LISTENERS (GLOBAL)
         * ============================================================ */
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderSidebar();
            loadModuleUI(currentModuleId);

            // Tuner Buttons
            document.querySelectorAll('.tune-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const note = e.target.getAttribute('data-note');
                    AudioEngine.playNote(note, 2.0, false);
                });
            });

            // Metronome Logic
            const btnMetro = document.getElementById('btn-metro-toggle');
            const iconMetro = document.getElementById('icon-metro');
            const ledMetro = document.getElementById('metro-led');
            const sliderBpm = document.getElementById('bpm-slider');
            const dispBpm = document.getElementById('bpm-display');
            let metroTimeout = null;

            function updateMetronome() {
                if (AudioEngine.isBackingActive) {
                    AudioEngine.stopBackingTrack();
                    AudioEngine.startBackingTrack(sliderBpm.value);
                }
            }

            sliderBpm.addEventListener('input', (e) => {
                dispBpm.innerText = e.target.value;
                if (metroTimeout) clearTimeout(metroTimeout);
                metroTimeout = setTimeout(updateMetronome, 300);
            });

            btnMetro.addEventListener('click', () => {
                if (AudioEngine.isBackingActive) {
                    AudioEngine.stopBackingTrack();
                    iconMetro.classList.replace('ph-stop', 'ph-play');
                    ledMetro.classList.replace('led-on', 'led-off');
                    btnMetro.classList.remove('bg-red-600', 'hover:bg-red-700');
                } else {
                    AudioEngine.startBackingTrack(sliderBpm.value);
                    iconMetro.classList.replace('ph-play', 'ph-stop');
                    ledMetro.classList.replace('led-off', 'led-on');
                    btnMetro.classList.add('bg-red-600', 'hover:bg-red-700');
                }
            });

            // Settings Modal & Backup Logic
            const modalSet = document.getElementById('modal-settings');
            const modalContent = document.getElementById('modal-settings-content');
            
            document.getElementById('btn-settings').addEventListener('click', () => {
                modalSet.classList.remove('hidden');
                modalSet.classList.add('flex');
                setTimeout(() => {
                    modalSet.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                }, 10);
            });

            document.getElementById('btn-close-settings').addEventListener('click', () => {
                modalSet.classList.add('opacity-0');
                modalContent.classList.add('scale-95');
                setTimeout(() => {
                    modalSet.classList.add('hidden');
                    modalSet.classList.remove('flex');
                }, 300);
            });

            // Backup Export (iOS Compatible via share)
            document.getElementById('btn-backup').addEventListener('click', async () => {
                const dataStr = JSON.stringify(appState);
                const file = new File([dataStr], "riffmaster_backup.json", {type: "application/json"});
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Backup RiffMaster',
                            text: 'Copia de seguridad de progreso de RiffMaster.'
                        });
                    } catch (error) { console.log('Share canceled or failed'); }
                } else {
                    // Fallback para escritorio
                    const url = URL.createObjectURL(file);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "riffmaster_backup.json";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
            });

            // Restore Import
            document.getElementById('file-restore').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        if (parsed.unlocked && parsed.completed) {
                            appState = parsed;
                            saveState();
                            renderSidebar();
                            loadModuleUI(1);
                            document.getElementById('restore-msg').classList.remove('hidden');
                            setTimeout(() => document.getElementById('restore-msg').classList.add('hidden'), 3000);
                        }
                    } catch (err) { alert("Archivo de copia de seguridad inválido."); }
                };
                reader.readAsText(file);
            });

            // Reset Data
            document.getElementById('btn-reset-data').addEventListener('click', () => {
                if(confirm("¿Estás seguro de que deseas borrar TODO tu progreso? Esta acción no se puede deshacer.")) {
                    appState = { unlocked: [1], completed: [] };
                    saveState();
                    renderSidebar();
                    loadModuleUI(1);
                    document.getElementById('btn-close-settings').click();
                }
            });
        });
    </script>
</body>
</html>
